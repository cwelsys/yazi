name: sync

on:
  push:
    branches: [cwel]
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

env:
  UPSTREAM: https://github.com/sxyazi/yazi.git
  # a mirror that cuts its own release tags, or empty
  MIRROR:

jobs:
  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: archlinux
    steps:
      - run: |
          curl -sSf -o /dev/null -X POST \
            -H "Authorization: token ${{ secrets.BOT_TOKEN }}" -H 'Content-Type: application/json' \
            -d '{"ref":"main","inputs":{"names":"${{ github.event.repository.name }}"}}' \
            https://git.cwel.sh/api/v1/repos/cwel/pkg/actions/workflows/ci.yml/dispatches

  # Upstream's tags come here so pkgver() can describe the fork; its branch
  # does not, because a verbatim copy would run upstream's own workflows on
  # this instance. nightly is a moving tag every recipe already excludes.
  upstream:
    if: ${{ github.event_name != 'push' }}
    runs-on: archlinux
    steps:
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          git clone -q --filter=blob:none --branch cwel https://git.cwel.sh/${{ github.repository }}.git fork && cd fork
          git config user.name bot && git config user.email bot@cwel.sh
          git config http.https://git.cwel.sh/.extraheader "Authorization: token $BOT_TOKEN"
          [ -z "$MIRROR" ] || git fetch -q "$MIRROR" '+refs/tags/*:refs/tags/*'
          git remote add upstream "$UPSTREAM"
          branch=$(git ls-remote --symref upstream HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2}')
          git fetch -q upstream "+refs/heads/$branch:refs/remotes/upstream/$branch" '+refs/tags/*:refs/tags/*' '^refs/tags/nightly'
          git push -q -f origin --tags || echo "could not update the tags"
          api=https://git.cwel.sh/api/v1/repos/${{ github.repository }}/issues
          title="sync: upstream conflicts with our patches"
          open=$(curl -sSf -H "Authorization: token $BOT_TOKEN" "$api?state=open&type=issues" | jq --arg t "$title" '.[] | select(.title == $t) | .number')
          if git merge-base --is-ancestor "upstream/$branch" HEAD; then echo "cwel already carries upstream $branch"
          elif git merge -q --no-ff -m "sync: merge upstream $branch" "upstream/$branch"; then git push -q origin cwel
          else
            files=$(git diff --name-only --diff-filter=U); echo "$files"
            body=$(printf '`git merge upstream/%s`\n\n```\n%s\n```' "$branch" "$files")
            [ -n "$open" ] || curl -sSf -o /dev/null -X POST -H "Authorization: token $BOT_TOKEN" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg t "$title" --arg b "$body" --arg a '${{ github.repository_owner }}' '{title: $t, body: $b, assignees: [$a]}')" "$api"
            exit 1
          fi
          for n in $open; do
            curl -sSf -o /dev/null -X PATCH -H "Authorization: token $BOT_TOKEN" -H 'Content-Type: application/json' -d '{"state":"closed"}' "$api/$n"
          done
