name: Release

on:
  push:
    branches: [cwel]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: cwelsys/ci/.github/workflows/fork-release.yml@main
    permissions:
      contents: write
    with:
      version-command: grep -m1 '^version' Cargo.toml | cut -d'"' -f2
