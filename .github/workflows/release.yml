name: Release

on:
  push:
    branches: [cwel]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: nightly
  SCCACHE_GHA_ENABLED: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.it.outputs.stale }}
      version: ${{ steps.it.outputs.version }}
      tree: ${{ steps.it.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2).$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

          released=$(gh release view "$TAG" --json body -q .body 2>/dev/null | tr -d '\r' | sed -n 's/^tree: //p')
          if [ "$released" = "$tree" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tree $tree is already released, nothing to build"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.stale == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build
        run: ./scripts/build.sh ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: yazi-${{ matrix.target }}.zip

  release:
    needs: [gate, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Move the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "$TAG"
          git push --force origin tag "$TAG"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          name: Nightly Build
          files: yazi-*.zip
          body: |
            `brew install cwelsys/tap/yazi` · `pacman -S yazi`

            version: ${{ needs.gate.outputs.version }}
            commit: ${{ github.sha }}
            tree: ${{ needs.gate.outputs.tree }}

  tap:
    needs: [gate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          repository: cwelsys/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Write the formula
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/nightly
        run: |
          set -euo pipefail
          sha() { sha256sum "yazi-$1.zip" | cut -d' ' -f1; }

          arm_mac=$(sha aarch64-apple-darwin)
          x86_mac=$(sha x86_64-apple-darwin)
          x86_linux=$(sha x86_64-unknown-linux-gnu)

          mkdir -p tap/Formula

          cat > tap/Formula/yazi.rb <<RUBY
          # Generated by cwelsys/yazi .github/workflows/release.yml. Do not edit.
          class Yazi < Formula
            desc "Blazing fast terminal file manager (cwelsys fork)"
            homepage "https://github.com/cwelsys/yazi"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "$BASE/yazi-aarch64-apple-darwin.zip"
                sha256 "$arm_mac"
              end
              on_intel do
                url "$BASE/yazi-x86_64-apple-darwin.zip"
                sha256 "$x86_mac"
              end
            end

            on_linux do
              on_intel do
                url "$BASE/yazi-x86_64-unknown-linux-gnu.zip"
                sha256 "$x86_linux"
              end
            end

            def install
              cd(Dir["yazi-*/"].first || ".") do
                bin.install "yazi", "ya"
                bash_completion.install Dir["completions/*.bash"]
                fish_completion.install Dir["completions/*.fish"]
                zsh_completion.install Dir["completions/_*"] - Dir["completions/_*.ps1"]
              end
            end

            test do
              assert_match "yazi", shell_output("#{bin}/yazi --version")
            end
          end
          RUBY

      - name: Style
        run: |
          if command -v brew >/dev/null; then
            brew style --fix tap/Formula/yazi.rb
          else
            echo "::warning::brew is unavailable, leaving the formula unstyled"
          fi

      - name: Commit
        working-directory: tap
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/yazi.rb
          if git diff --quiet --cached; then
            echo "formula already current"
            exit 0
          fi

          git commit -m "yazi $VERSION"
          git pull --rebase --autostash
          git push
