# Lives in each fork as .woodpecker.yaml on the cwel branch, with UPSTREAM
# and MIRROR filled in. cwel is upstream plus our patches. A push to it
# builds the package; the sync cron merges upstream into it, and a conflict
# is a red pipeline until `git merge upstream/<branch>` is pushed by hand.
when:
  - event: push
    branch: cwel
  - event: cron

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  # Upstream's tags come here so pkgver() can describe the fork; its branch
  # does not, because a verbatim copy would carry upstream's own CI config.
  # nightly is a moving tag every recipe already excludes.
  - name: upstream
    image: git.cwel.sh/cwel/archlinux
    when:
      event: cron
    environment:
      UPSTREAM: https://github.com/sxyazi/yazi.git
      # a mirror that cuts its own release tags, or empty
      MIRROR: ''
      BOT_TOKEN:
        from_secret: BOT_TOKEN
    commands:
      - git config user.name bot && git config user.email bot@cwel.sh
      - origin=https://bot:$BOT_TOKEN@git.cwel.sh/${CI_REPO}.git
      - '[ -z "$MIRROR" ] || git fetch -q "$MIRROR" "+refs/tags/*:refs/tags/*"'
      - branch=$(git ls-remote --symref "$UPSTREAM" HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2}')
      - git fetch -q "$UPSTREAM" "+refs/heads/$branch:refs/remotes/upstream/$branch" "+refs/tags/*:refs/tags/*" "^refs/tags/nightly"
      - git push -q -f "$origin" --tags || echo "could not update the tags"
      - |
        if git merge-base --is-ancestor "upstream/$branch" HEAD; then
          echo "cwel already carries upstream $branch"
          exit 0
        fi
      - 'git merge -q --no-ff -m "sync: merge upstream $branch" upstream/$branch'
      - git push -q "$origin" HEAD:cwel

  - name: build
    image: git.cwel.sh/cwel/archlinux
    when:
      event: push
    environment:
      WOODPECKER_TOKEN:
        from_secret: WOODPECKER_TOKEN
    commands:
      - 'id=$(curl -sSf -H "Authorization: Bearer $WOODPECKER_TOKEN" ${CI_SYSTEM_URL}/api/repos/lookup/cwel/pkg | jq .id)'
      - 'curl -sSf -o /dev/null -X POST -H "Authorization: Bearer $WOODPECKER_TOKEN" -H "Content-Type: application/json" -d ''{"branch":"main","variables":{"NAME":"${CI_REPO_NAME}"}}'' ${CI_SYSTEM_URL}/api/repos/$id/pipelines'

  - name: red
    image: codeberg.org/l-x/woodpecker-ntfy
    when:
      status: [failure]
    settings:
      url: https://ntfy.cwel.casa/ci
      token:
        from_secret: NTFY_TOKEN
      title: ${CI_REPO_NAME} sync is red
      priority: high
      message: ${CI_PIPELINE_URL}
